[package]
name = "weto-sys-windows"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Реализации трейтов weto-sys на Windows API. Чистая часть (разбор буфера
# процессов, родитель по времени создания, npm-шимы, PATHEXT) собирается и
# тестируется везде, в том числе в Linux-контейнере; вызовы API — под cfg(windows).
[dependencies]
weto-core = { workspace = true }
weto-config = { workspace = true }
weto-sys = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-link = { workspace = true }
windows-sys = { workspace = true, features = [
    "Wdk_System_SystemInformation",
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security_Credentials",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Shell",
] }

[dev-dependencies]
tempfile = { workspace = true }
