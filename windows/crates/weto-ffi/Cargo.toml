[package]
name = "weto-ffi"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Мост к приложению на C#: всё состояние приложения в Rust, наружу — узкий
# C ABI на JSON. Модель экрана и команды — чистые и тестируются где угодно;
# сборка охраны из адаптеров Windows и сам ABI — под cfg(windows).
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
weto-core = { workspace = true }
weto-config = { workspace = true }
weto-sys = { workspace = true }
weto-guard = { workspace = true }
weto-sys-windows = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
