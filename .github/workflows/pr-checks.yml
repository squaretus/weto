name: CI

# Только pull_request: прогон на этом событии проверяет не ветку, а результат
# слияния её с master, то есть ровно то дерево, которое ляжет в master. Прогон
# на пуше в master перепроверял бы уже проверенное, и делал бы это после того,
# как решение о мердже принято, — поздно, чтобы что-то изменить.
on:
  pull_request:
    branches: [master]

jobs:
  macos:
    name: Build & Test (macOS)
    runs-on: macos-26
    # Исходники macOS живут в macos/; относительные пути внутри скриптов
    # разрешаются от него же, поэтому сами скрипты правок не потребовали.
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Unit tests
        run: swift test

      # Пакет обновления — отдельный SPM-пакет, и `swift test` корневого
      # проекта его тестов не видит.
      - name: UpdateKit unit tests
        run: swift test --package-path Packages/UpdateKit

      # Раскладка установщика проверяется здесь, а не только на релизе: оба
      # прошлых сбоя («приложение не появилось» и «попап падал при клике») были
      # именно про упаковку, а CI до сих пор их не видел. Контракт делает
      # настоящую релизную сборку и заодно прогоняет launch-agent-contract.sh.
      # Границы модулей: тёплый кэш SwiftPM прячет незаявленную зависимость,
      # и `swift build` в рабочем дереве проходит там, где чистая сборка падает.
      - name: Module boundaries
        run: bash scripts/tests/module-boundary-contract.sh

      # Тестом этот шаг не является: внутри настоящая release-сборка со
      # своей компиляцией и подписью, и стоит она дольше всех тестов вместе.
      - name: Release build & packaging contracts
        run: |
          chmod +x scripts/build.sh scripts/preinstall scripts/postinstall \
                   scripts/tests/build-artifact-contract.sh \
                   scripts/tests/launch-agent-contract.sh \
                   scripts/tests/install-idempotency-contract.sh \
                   scripts/tests/uninstall-parity-contract.sh
          bash scripts/tests/build-artifact-contract.sh 9.9.9
          bash scripts/tests/install-idempotency-contract.sh
          bash scripts/tests/uninstall-parity-contract.sh

  linux:
    name: Build & Test (Linux ${{ matrix.arch }})
    # Обе архитектуры проверяются здесь, а не только в релизе: иначе поломка
    # на arm всплыла бы в момент выпуска — худший момент из возможных.
    # arm64-раннеры GitHub бесплатны для публичных репозиториев.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: linux
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libssl-dev pkg-config zstd xvfb iproute2 musl-tools

      # Терминальная версия собирается статически под musl: она едет на серверы,
      # а бинарник, слинкованный с glibc раннера 24.04, требует GLIBC_2.39
      # и не запустится ни на Debian 12, ни на Ubuntu 22.04.
      - name: Add musl target
        run: rustup target add "$(uname -m)-unknown-linux-musl"

      - name: Lint
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings

      # Инвариант границ ядра: ни tokio, ни zbus, ни netlink, ни gtk4
      # в графе зависимостей weto-core.
      - name: Boundary contract
        run: bash scripts/tests/core-boundary-contract.sh

      # Дисплей поднимаем сами, а не через xvfb-run: тот умеет зависнуть —
      # стартует Xvfb и не запускает команду вовсе, а на CI это выглядит как
      # молча висящая сборка до самого таймаута.
      - name: Unit tests
        run: |
          Xvfb :99 -screen 0 1280x1024x24 >/dev/null 2>&1 &
          sleep 2
          DISPLAY=:99 cargo test --workspace

      # Приложение обязано подниматься без монитора и без трея, молча.
      - name: App smoke contract
        run: bash scripts/tests/app-smoke-contract.sh

      # Раннер даёт root, поэтому контракты, которым нужны интерфейсы
      # и правила маршрутизации, идут прямо здесь.
      - name: Network contracts
        run: |
          sudo -E env "PATH=$PATH" bash scripts/tests/policy-routing-contract.sh
          sudo -E env "PATH=$PATH" bash scripts/tests/netlink-events-contract.sh

      # И этот тоже не тест: release-сборка всего workspace плюс проверка
      # раскладки установленного дерева. Самый долгий шаг job-а.
      - name: Release build & install contract
        run: |
          bash scripts/build.sh 9.9.9
          bash scripts/tests/install-contract.sh \
            "target/release_build/weto-9.9.9-$(uname -m)-linux.tar.zst" 9.9.9

      # Установщик терминальной версии один на обе системы и живёт в shared/:
      # релиз подделывается каталогом под file://, сеть не нужна.
      - name: CLI installer contract
        run: bash ../shared/cli/tests/install-contract.sh

  # Охрана Windows-версии — те же Rust-крейты, что у Linux (`weto-core`,
  # `weto-config`, `weto-sys`, `weto-guard`, `weto-update`), и их тесты обязаны
  # идти на настоящей Windows: `cargo check` под mingw в контейнере ловит только
  # протёкшую Linux-зависимость, а не поведение путей, потоков и сети.
  windows-shared:
    name: Shared Rust on Windows (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            arch: x86_64
          - runner: windows-11-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: linux
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # На образе arm64 Rust может не стоять: ставится тем же rustup,
      # что и везде, без сторонних action.
      - name: Rust toolchain
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          if ! command -v cargo >/dev/null; then
            curl -sSf -o "$RUNNER_TEMP/rustup-init.exe" "https://win.rustup.rs/$ARCH"
            "$RUNNER_TEMP/rustup-init.exe" -y --profile minimal
            echo "$USERPROFILE/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$USERPROFILE/.cargo/bin:$PATH"
          fi
          rustup component add clippy
          cargo --version

      - name: Lint
        run: >
          cargo clippy -p weto-core -p weto-config -p weto-sys -p weto-guard -p weto-update
          --all-targets -- -D warnings

      - name: Unit tests
        # --no-fail-fast: падение одного тестового бинарника не прячет остальные.
        run: >
          cargo test --no-fail-fast
          -p weto-core -p weto-config -p weto-sys -p weto-guard -p weto-update

  # Адаптеры Windows (windows/crates): тесты порождают настоящие процессы,
  # приостанавливают и завершают их, ходят в Диспетчер учётных данных и реестр
  # и сверяют пробу маршрута с Find-NetRoute — всё это только на живой Windows.
  windows:
    name: Build & Test (Windows ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            arch: x86_64
          - runner: windows-11-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: windows/crates
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          if ! command -v cargo >/dev/null; then
            curl -sSf -o "$RUNNER_TEMP/rustup-init.exe" "https://win.rustup.rs/$ARCH"
            "$RUNNER_TEMP/rustup-init.exe" -y --profile minimal
            echo "$USERPROFILE/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$USERPROFILE/.cargo/bin:$PATH"
          fi
          rustup component add clippy rustfmt
          cargo --version

      - name: Lint
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings

      - name: Unit and live tests
        run: cargo test --workspace --no-fail-fast

  # Приложение Windows (C#, WinUI 3) целиком: мост, иконки, publish под
  # архитектуру раннера, установщик Inno Setup. Живой Windows-машины у проекта нет, поэтому
  # попап и окно настроек снимаются скриншотами — артефакт windows-screens-*.
  windows-app:
    name: Windows app (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            arch: x86_64
          - runner: windows-11-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          if ! command -v cargo >/dev/null; then
            curl -sSf -o "$RUNNER_TEMP/rustup-init.exe" "https://win.rustup.rs/$ARCH"
            "$RUNNER_TEMP/rustup-init.exe" -y --profile minimal
            echo "$USERPROFILE/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$USERPROFILE/.cargo/bin:$PATH"
          fi
          cargo --version
          dotnet --list-sdks

      - name: Build
        env:
          ARCH: ${{ matrix.arch }}
        run: bash windows/scripts/build.sh 9.9.9 "$ARCH"

      # Windows PowerShell 5.1, а не pwsh: снимок окна собирается Add-Type
      # на System.Drawing, а в pwsh 7 явные сборки вытесняют стандартные ссылки.
      - name: Screenshots
        shell: powershell
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          New-Item -ItemType Directory -Force screens | Out-Null
          $exe = "windows/app/out/$env:ARCH/Weto.exe"
          ./windows/scripts/tests/screenshot.ps1 -Exe $exe -Flag --show-status -Out screens/status
          ./windows/scripts/tests/screenshot.ps1 -Exe $exe -Flag --show-status-sample -Out screens/paused
          ./windows/scripts/tests/screenshot.ps1 -Exe $exe -Flag --show-settings -Out screens/settings
          ./windows/scripts/tests/screenshot.ps1 -Exe $exe -Flag --show-settings-end -Out screens/settings-end
          ./windows/scripts/tests/screenshot.ps1 -Exe $exe -Flag --show-update-sample -Out screens/update
          ./windows/scripts/tests/screenshot.ps1 -Exe $exe -Flag "--show-status-sample --light-theme" -Out screens/light-paused
          ./windows/scripts/tests/screenshot.ps1 -Exe $exe -Flag "--show-settings --light-theme" -Out screens/light-settings

      # Окно настроек с целями: строки целей с числом процессов и выбранное
      # VPN-приложение — пустые состояния этого не показывают. Цель — ping,
      # её процесс запущен; состояние профиля вычищается после снимков,
      # чтобы контракт установщика начинал с чистого.
      - name: Screenshots with targets
        shell: powershell
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          # VPN-приложение — powershell, в котором идёт этот шаг: запущено, и охрана
          # не завершает цели по доказательству, а ставит их на паузу до ответа.
          # Вторая цель — ярлык Блокнота: на плашке значок приложения из ярлыка.
          $config = Join-Path $env:APPDATA 'weto'
          New-Item -ItemType Directory -Force $config | Out-Null
          $link = Join-Path $env:RUNNER_TEMP 'Notepad.lnk'
          $shortcut = (New-Object -ComObject WScript.Shell).CreateShortcut($link)
          $shortcut.TargetPath = 'C:\Windows\System32\notepad.exe'
          $shortcut.Save()
          $powershell = 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe'
          @(
            'blocked_countries = ["RU"]'
            'targets = ['
            '  { entry = "ping", display_name = "ping", kind = "binary", path = ''C:\Windows\System32\PING.EXE'', launch_paths = ["ping"] },'
            "  { entry = '$link', display_name = 'Notepad', kind = 'binary', path = 'C:\Windows\System32\notepad.exe', launch_paths = ['$link'] },"
            ']'
            '[vpn_app]'
            "entry = '$powershell'"
            'display_name = "powershell"'
            'kind = "binary"'
            "path = '$powershell'"
          ) | Set-Content -Encoding utf8 (Join-Path $config 'config.toml')
          $ping = Start-Process -FilePath ping -ArgumentList '-n', '120', '127.0.0.1' -PassThru -WindowStyle Hidden
          $notepad = Start-Process -FilePath notepad -PassThru -WindowStyle Minimized
          $exe = "windows/app/out/$env:ARCH/Weto.exe"
          try {
            ./windows/scripts/tests/screenshot.ps1 -Exe $exe -Flag --show-settings -Out screens/targets-settings
            ./windows/scripts/tests/screenshot.ps1 -Exe $exe -Flag --show-status -Out screens/targets-status
          } finally {
            Stop-Process -Id $ping.Id, $notepad.Id -Force -ErrorAction SilentlyContinue
            # Профиль обязан уйти целиком: оставшиеся настройки с целями меняли бы
            # поведение Weto в контракте установщика. Молчать об отказе нельзя.
            foreach ($dir in $config, (Join-Path $env:LOCALAPPDATA 'weto')) {
              if (Test-Path $dir) { Remove-Item -Recurse -Force $dir }
            }
          }

      # Установщик целиком: тихая установка, установка поверх работающего
      # (так выглядит обновление) и удаление со всеми следами.
      - name: Installer contract
        # Зависание (окно, которого никто не закроет) не держит раннер шесть часов.
        timeout-minutes: 15
        shell: powershell
        env:
          ARCH: ${{ matrix.arch }}
        run: ./windows/scripts/tests/installer-contract.ps1 -Setup "windows/app/out/release_build/weto-9.9.9-$env:ARCH-windows-setup.exe"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-screens-${{ matrix.arch }}
          path: screens/

  generators:
    name: Generators are idempotent
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # Токены и иконка генерируются из общих исходников. Повторная генерация
      # обязана ничего не менять: расхождение означает, что кто-то правил
      # сгенерированный файл руками, и правка потеряется на следующей сборке.
      - name: Regenerate and diff
        run: |
          bash macos/scripts/build-icon.sh
          cargo run --manifest-path shared/tools/gen-tokens/Cargo.toml -- \
            --out-swift macos/Sources/WetoDesign/Tokens/WetoTokens.swift \
            --out-css-dir linux/crates/weto-ui/style \
            --out-xaml-dir windows/app/Weto/Themes
          bash shared/tools/sync-flags.sh
          git diff --exit-code
