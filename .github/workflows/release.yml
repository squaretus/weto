name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build PKG & Publish Release
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # Имя тега подставляется через окружение, а не интерполяцией в run:
      # прямая подстановка в шелл — классический путь для инъекции команд.
      - name: Extract version from tag
        id: version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${TAG_NAME#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Тег '$TAG_NAME' не похож на версию vX.Y.Z" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Test
        run: swift test

      - name: Build release PKG
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          chmod +x scripts/build.sh scripts/preinstall scripts/postinstall
          scripts/build.sh "$VERSION"

      # Релиз в этот же репозиторий — источник автообновления:
      # приложение опрашивает Releases API каждые 6 часов.
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: .build/release_build/Weto-${{ steps.version.outputs.VERSION }}.pkg
          name: weto ${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
