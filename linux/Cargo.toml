[workspace]
resolver = "2"
members = ["crates/weto-core", "crates/weto-sys", "crates/weto-config", "crates/weto-guard", "crates/wetod", "crates/weto-ui", "crates/weto-app", "crates/weto-tray", "crates/weto-update"]

[workspace.package]
edition = "2021"
rust-version = "1.82"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
rustix = "1"
if-addrs = "0.13"
libc = "0.2"
toml = "0.9"
gtk4 = { version = "0.10", features = ["v4_14"] }
ksni = "0.3"
minisign-verify = "0.2"
tar = "0.4"
zstd = "0.13"
tokio = { version = "1", features = ["rt", "sync", "macros"] }
resvg = "0.45"
ureq = { version = "2", features = ["tls"], default-features = false }
