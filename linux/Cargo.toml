[workspace]
resolver = "2"
members = ["crates/weto-core", "crates/weto-sys", "crates/weto-config", "crates/weto-guard", "crates/wetod", "crates/weto-ui", "crates/weto-app"]

[workspace.package]
edition = "2021"
rust-version = "1.82"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
rustix = "1"
if-addrs = "0.13"
libc = "0.2"
toml = "0.9"
gtk4 = { version = "0.10", features = ["v4_14"] }
ureq = { version = "2", features = ["tls"], default-features = false }
