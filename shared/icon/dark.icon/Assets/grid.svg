<?xml version="1.0" encoding="UTF-8"?>
<!--
  weto · слой знака: буква W с приподнятой средней вершиной — всплеск, как на
  кардиограмме. Ножки одинаковой высоты (408), долины на 730, пик на 222;
  размах 210…814. Толщина штриха 96, торцы и стыки круглые —
  под скругления остального интерфейса.

  Знак нарисован путём, а не текстом: шрифт SVG-рендерер может не подхватить,
  а путь одинаково выглядит и в Icon Composer, и в композиторе иконки.
  Цвет — токен `ink` темы, фон в icon.json — её же `shell`: та самая пара,
  которой приложение рисует заголовки на своих поверхностях.

  Рамка повторяет форму и радиус фигуры: фон иконки равен фону приложения,
  поэтому без неё квадрат сливается с подложкой того же цвета.
  Канва 1024×1024, прозрачная.
-->
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <rect x="4.0" y="4.0" width="1016" height="1016"
        rx="229" ry="229" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="8"/>
  <polyline points="210,408 361,730 512,222 663,730 814,408" fill="none" stroke="#F4F2FB" stroke-width="96"
            stroke-linecap="round" stroke-linejoin="round"/>
</svg>
